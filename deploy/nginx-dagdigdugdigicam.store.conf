# ============================================================
# MudahSewa (dagdigdugdigicam.store) — Nginx reverse proxy
# Main app :3000 | GoPay gateway :3100 | OpenWA :2785
# ============================================================

server {
    listen 80;
#    listen 443 ssl http2; # pending cert for Let's Encrypt
    server_name dagdigdugdigicam.store www.dagdigdugdigicam.store wa.dagdigdugdigicam.store;

    # Include well-known ACME challenge handler for Let's Encrypt
    include /www/server/panel/vhost/nginx/well-known/dagdigdugdigicam.store.conf;

    # SSL certificate paths — to be enabled when Let's Encrypt cert exists
#    ssl_certificate /www/server/panel/vhost/cert/dagdigdugdigicam.store/fullchain.pem;
#    ssl_certificate_key /www/server/panel/vhost/cert/dagdigdugdigicam.store/privkey.pem;
#    ssl_protocols TLSv1.2 TLSv1.3;
#    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
#    ssl_prefer_server_ciphers on;
#    ssl_session_cache shared:SSL:10m;
#    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Body size limit untuk upload bukti/galeri (serverActions max 240mb di Next config)
    client_max_body_size 250m;

    # Logging
    access_log /www/wwwroot/dagdigdugdigicam.store/logs/nginx-access.log;
    error_log /www/wwwroot/dagdigdugdigicam.store/logs/nginx-error.log;

    # Health check (no auth)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # GoPay gateway via subpath /gopay/* -> :3100
    location /gopay/ {
        rewrite ^/gopay/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Payment webhook — timeout panjang untuk QRIS polling
    location /api/payments/notify {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Main application -> Next.js :3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

