# ============================================================
# OpenWA WhatsApp subdomain -> :2785
# (Main domain dagdigdugdigicam.store is served by
#  aaPanel-generated node_mudahsewa_app.conf)
# ============================================================
server {
    listen 80;
#    listen 443 ssl http2; # pending cert
    server_name wa.dagdigdugdigicam.store;

    # Include well-known ACME challenge handler
    include /www/server/panel/vhost/nginx/well-known/wa.dagdigdugdigicam.store.conf;

    # SSL certificate paths (enable after cert issued)
#    ssl_certificate /www/server/panel/vhost/cert/wa.dagdigdugdigicam.store/fullchain.pem;
#    ssl_certificate_key /www/server/panel/vhost/cert/wa.dagdigdugdigicam.store/privkey.pem;
#    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /www/wwwroot/dagdigdugdigicam.store/logs/nginx-wa-access.log;
    error_log /www/wwwroot/dagdigdugdigicam.store/logs/nginx-wa-error.log;

    location /.well-known/ {
        root /www/wwwroot/dagdigdugdigicam.store;
    }

    location / {
        proxy_pass http://127.0.0.1:2785;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
