# ============================================================
# wa.dagdigdugdigicam.store — OpenWA Dashboard subdomain
# Proxy ke :2785 dengan SSL dari cert dagdigdugdigicam.store
# ============================================================
server {
    listen 80;
    listen 443 ssl http2;
    server_name wa.dagdigdugdigicam.store;

    # Shared certificate dari main domain
    ssl_certificate /www/server/panel/vhost/cert/dagdigdugdigicam.store/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/dagdigdugdigicam.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Log
    access_log /www/wwwroot/dagdigdugdigicam.store/logs/nginx-wa-access.log;
    error_log /www/wwwroot/dagdigdugdigicam.store/logs/nginx-wa-error.log;

    # Health check
    location = /api/health {
        proxy_pass http://127.0.0.1:2785/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy ke OpenWA dashboard & API
    location / {
        proxy_pass http://127.0.0.1:2785;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
