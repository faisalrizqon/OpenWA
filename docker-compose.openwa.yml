version: "3.8"

services:
  openwa-whatsapp:
    image: rmyndharis/openwa:latest
    container_name: mudahsewa-whatsapp
    restart: unless-stopped
    ports:
      - "2785:2785"
    volumes:
      - ./openwa-data:/app/data
    environment:
      - X_API_KEY=${OPENWA_API_KEY}
      - ENABLE_DASHBOARD=true
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - easysewa-network

networks:
  easysewa-network:
    driver: bridge

volumes:
  openwa-data:
    name: mudahsewa-openwa-data
