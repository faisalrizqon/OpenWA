server {
    listen 80;
    listen 443 ssl http2;
    server_name dagdigdugdigicam.store www.dagdigdugdigicam.store;

    # SSL Certificate — replace with path from aaPanel when configured
    ssl_certificate /etc/ssl/aapanel_certs/dagdigdugdigicam.store.crt;
    ssl_certificate_key /etc/ssl/aapanel_certs/dagdigdugdigicam.store.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31560000; includeSubDomains" always;

    # Logging
    access_log /www/wwwroot/dagdigdugdigicam.store/logs/nginx-access.log;
    error_log /www/wwwroot/dagdigdugdigicam.store/logs/nginx-error.log;

    # Health check endpoint (no auth required)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Main application routes → Node.js app
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # WebSocket support (if any real-time features)
    location /api/ws {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Payment gateway API timeout (longer for QRIS generation)
    location /api/payments/notify {
        proxy_pass http://localhost:3000;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Admin area timeout
    location /admin {
        proxy_pass http://localhost:3000;
        proxy_read_timeout 90s;
    }
}

# GoPay Gateway API endpoints at /gopay/*
location /gopay/ {
    rewrite ^/gopay/(.*)$ /$1 break;
    proxy_pass http://localhost:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}
